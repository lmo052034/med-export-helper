name: UI checks
on:
  pull_request:
    paths: ['src/**', 'public/**', 'tests/**', 'package*.json', '*config*', '.github/workflows/ui-checks.yml']
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: test-results/
