name: Collect support notices

# 매일 06:00 KST(21:00 UTC)에 지원사업 공고를 모아 public/data/notices.js를 갱신합니다.
# 기업마당 인증키는 Settings → Secrets and variables → Actions → BIZINFO_KEY 로 등록합니다.
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect
        env:
          BIZINFO_KEY: ${{ secrets.BIZINFO_KEY }}
        run: node scripts/collect-notices.mjs
      - name: Commit if changed
        run: |
          git config user.name "notice-bot"
          git config user.email "notice-bot@users.noreply.github.com"
          git add public/data/notices.js
          git diff --cached --quiet || (git commit -m "Update support notices $(date -u +%F)" && git push)
