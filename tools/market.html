<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수출할 나라 고르기</title>
<link rel="stylesheet" href="assets/app.css">
<style>
  .mx td { min-width: 150px; }
  .mx td.ind { min-width: 190px; }
  .mx .ind b { display: block; font-size: 15px; }
  .mx .ind .small { color: var(--muted); }
  .cell input.v { font-weight: 700; }
  .cell .meta { display: grid; grid-template-columns: 1fr 64px; gap: 4px; margin-top: 4px; }
  .cell .meta input { font-size: 12.5px; padding: 5px 7px; }
  .w { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .w output { font-size: 12.5px; font-weight: 700; width: 28px; text-align: right; color: var(--accent-ink); }
  details summary { cursor: pointer; font-weight: 700; color: var(--accent-ink); font-size: 14.5px; }
  .bar-row { margin-bottom: 12px; }
  .bar-row .top { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 4px; }
  .bar { height: 10px; background: var(--surface); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--line-2); border-radius: 99px; transition: width .3s; }
  .bar-row.win .bar i { background: var(--accent); }
  .winner { font-size: 26px; font-weight: 800; margin: 2px 0 12px; color: var(--accent-ink); }
  .reasons { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 14.5px; }
  .meter { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .meter div { background: var(--surface); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; color: var(--muted); }
  .meter b { display: block; font-size: 18px; color: var(--ink); }
</style>
</head>
<body>
<main class="wrap">
  <div id="head"></div>
  <div class="banner info"><span>i</span><div>HS 6자리 코드는 범위가 넓어요. 예를 들어 9018.90은 '그 밖의 의료기기' 전체라서, 이 수입액을 우리 제품 시장 규모라고 말하면 안 됩니다. 한계를 함께 적어 두세요.</div></div>

  <div class="grid g-side">
    <section class="card">
      <div class="card-head"><div><h2>비교표</h2><p class="hint">칸마다 숫자 · 출처 · 연도를 넣어요. 나라 이름은 표 맨 위에서 바꿀 수 있어요.</p></div></div>
      <div class="tbl-wrap"><table class="mx" id="mx"></table></div>
      <details class="mt"><summary>기준별 중요도 바꾸기 (선택)</summary><p class="hint mt">중요한 기준일수록 크게. 왜 그렇게 정했는지 한 줄로 설명할 수 있어야 해요.</p><div id="weights" class="grid g2 mt" style="gap:6px 16px"></div></details>
    </section>

    <aside class="sticky">
      <section class="card">
        <div class="hint">비교 결과</div>
        <div class="winner" id="winner">–</div>
        <div id="bars"></div>
        <div class="meter" id="meter"></div>
      </section>
      <section class="card mt">
        <h2>고른 이유 3가지 (초안)</h2>
        <p class="hint mb">1위 나라가 크게 앞선 기준 순서예요. 문장은 다듬어 쓰세요.</p>
        <ol class="reasons" id="reasons"></ol>
        <div class="btns mt"><button class="btn sm" id="b-reasons">이유 복사</button></div>
      </section>
      <section class="card mt">
        <h2>점검</h2>
        <ul class="checks mt" id="checks"></ul>
      </section>
    </aside>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
TAK.head("market.html",
  "후보 나라 2–3곳을 같은 기준(수입 규모, 성장, 한국산 비중, 관세, 인증 난이도, 경쟁)으로 나란히 놓고 첫 수출국을 고릅니다. 기준 하나를 빼도 결론이 같은지도 확인해 줍니다.",
  [["이 페이지에서", "후보 나라를 숫자로 비교하고 1곳을 고릅니다."], ["준비물", "HS 코드, UN Comtrade·ITC Trade Map 같은 통계 사이트"], ["다 하면", "04 HS·관세·인증 확인에서 그 나라를 자세히 봅니다."]],
  `<button class="btn" id="b-example">예시 값 넣기</button><button class="btn" id="b-clear">숫자 비우기</button><button class="btn" id="b-prompt">AI에게 숫자 묻기</button><button class="btn primary" id="b-copy">표 복사</button>`);

const P = TAK.profile();
const names0 = (P.countries || "").split(/[,·]/).map((s) => s.trim()).filter(Boolean);
const C = ["c1", "c2", "c3"].map((id, k) => ({ id, name: names0[k] || ["후보 1", "후보 2", "후보 3"][k] }));

// dir: 1 = 높을수록 좋음, -1 = 낮을수록 좋음
const IND = [
  { id: "imp", label: "수입 규모", unit: "USD 백만", desc: "그 나라가 이 HS 코드를 1년에 얼마나 수입하나", dir: 1, w: 20 },
  { id: "growth", label: "성장", unit: "%", desc: "수입액이 늘고 있나 (연 증가율)", dir: 1, w: 15 },
  { id: "kr", label: "한국산 비중", unit: "%", desc: "수입 중 한국 제품 비율", dir: 1, w: 15 },
  { id: "tariff", label: "관세", unit: "%", desc: "우리가 받을 수 있는 가장 낮은 세율", dir: -1, w: 10 },
  { id: "cert", label: "인증 난이도", unit: "1–5", desc: "1 쉬움 · 5 어려움", dir: -1, w: 20 },
  { id: "comp", label: "경쟁", unit: "1–5", desc: "1 약함 · 5 치열", dir: -1, w: 10 },
  { id: "track", label: "거래해 본 적", unit: "1=예", desc: "이미 거래한 바이어·대리점이 있나", dir: 1, w: 10 },
];

// 예시 값: HS 9018.90 공식 통계(WITS/UN Comtrade, 2026.10.25 조회)와 공개 제도에 따른 판단. 나라 이름이 같을 때만 채웁니다
const W = "WITS HS901890";
const EXAMPLE = {
  인도네시아: { imp: [410.9, W], growth: [-1.8, W + " 전년 대비"], kr: [5.28, W + " 한국산"], cert: [2, "판단: AKL은 현지 유통사가 신청, CE 필수 아님"], comp: [3, "판단: 중국 23.4% · 미·독 31% (WITS)"] },
  일본: { imp: [2932.6, W], growth: [5.9, W + " 전년 대비"], kr: [4.59, W + " 한국산"], tariff: [0, "일본 세관 실행관세율표 90류 Free"], cert: [5, "판단: 현지 MAH 필요, PMDA·인증기관 심사"], comp: [5, "판단: 미 34.1% · 멕시코 17.4%, 현지 브랜드"] },
  홍콩: { imp: [670.4, W], growth: [1.0, W + " 전년 대비"], kr: [5.64, W + " 한국산"], tariff: [0, "홍콩 자유항, 일반 수입관세 없음"], cert: [3, "판단: MDACS 자율 등재·현지 책임자(LRP) 필요"], comp: [3, "판단: 중국 29.5% · 미 23.7%"] },
};

let S = TAK.load("market", null) || { cells: {}, w: {}, names: {} };
IND.forEach((i) => (S.w[i.id] = S.w[i.id] != null ? S.w[i.id] : i.w));
C.forEach((c) => (c.name = S.names[c.id] || c.name));
if (!TAK.load("market", null) && P.sample) applyExample(true);

const key = (i, c) => i + ":" + c;
function cell(i, c) { return S.cells[key(i, c)] || (S.cells[key(i, c)] = { v: "", src: "", yr: "" }); }
function applyExample(silent) {
  let n = 0;
  C.forEach((c) => Object.entries(EXAMPLE[c.name] || {}).forEach(([i, [v, src]]) => { S.cells[i + ":" + c.id] = { v, src, yr: "2025" }; n++; }));
  if (!silent) TAK.toast(n ? `예시 값 ${n}칸을 채웠어요 (인도네시아·일본·홍콩만 있어요)` : "예시 값은 인도네시아·일본·홍콩만 있어요. 나라 이름을 확인하세요");
}

function buildTable() {
  let h = "<thead><tr><th>기준</th>" + C.map((c) => `<th><input data-cn="${c.id}" value="${TAK.esc(c.name)}" style="font-weight:700;padding:6px 8px" title="나라 이름"></th>`).join("") + "</tr></thead><tbody>";
  IND.forEach((i) => {
    h += `<tr><td class="ind"><b>${i.label}</b><span class="small">${i.desc} · ${i.unit} · ${i.dir > 0 ? "높을수록 좋음" : "낮을수록 좋음"}</span></td>`;
    C.forEach((c) => {
      const x = cell(i.id, c.id);
      h += `<td class="cell" data-cell="${key(i.id, c.id)}"><input class="v" type="number" step="any" placeholder="${i.unit}" value="${x.v}" data-f="v">
        <div class="meta"><input placeholder="출처" value="${TAK.esc(x.src)}" data-f="src"><input placeholder="연도" value="${TAK.esc(x.yr)}" data-f="yr"></div></td>`;
    });
    h += "</tr>";
  });
  document.getElementById("mx").innerHTML = h + "</tbody>";
  document.getElementById("weights").innerHTML = IND.map((i) => `<div class="w"><span style="flex:1;font-size:14px">${i.label}</span><input type="range" min="0" max="40" step="5" data-w="${i.id}" value="${S.w[i.id]}" style="flex:2"><output>${S.w[i.id]}</output></div>`).join("");
}

document.querySelector(".g-side").addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset.cn) { S.names[el.dataset.cn] = el.value; C.find((c) => c.id === el.dataset.cn).name = el.value || el.dataset.cn; }
  else if (el.dataset.w) { S.w[el.dataset.w] = +el.value; el.nextElementSibling.textContent = el.value; }
  else if (el.dataset.f) { S.cells[el.closest("td").dataset.cell][el.dataset.f] = el.value; }
  else return;
  update();
});

const num = (i, c) => { const x = cell(i, c); return x.v === "" || x.v == null || isNaN(+x.v) ? null : +x.v; };
// 최소–최대 정규화. 값이 2개 미만인 기준은 계산에서 뺍니다
function score(drop) {
  const res = {}; C.forEach((c) => (res[c.id] = { s: 0, parts: {} }));
  let wsum = 0;
  IND.forEach((i) => {
    if (i.id === drop || !S.w[i.id]) return;
    const vals = C.map((c) => num(i.id, c.id)).filter((v) => v != null);
    if (vals.length < 2) return;
    const mn = Math.min(...vals), mx = Math.max(...vals);
    wsum += S.w[i.id];
    C.forEach((c) => {
      const v = num(i.id, c.id);
      const n = v == null ? 0 : mx === mn ? 1 : i.dir > 0 ? (v - mn) / (mx - mn) : (mx - v) / (mx - mn);
      res[c.id].parts[i.id] = n; res[c.id].s += S.w[i.id] * n;
    });
  });
  C.forEach((c) => (res[c.id].s = wsum ? (res[c.id].s / wsum) * 100 : 0));
  return res;
}
function fmtV(i, v) {
  if (v == null) return "미입력";
  if (i.id === "track") return v ? "거래 경험 있음" : "거래 경험 없음";
  if (i.unit === "1–5") return v + "/5";
  if (i.unit === "USD 백만") return "USD " + v.toLocaleString() + "M";
  return v + i.unit;
}

let reasonsText = "";
function update() {
  TAK.save("market", S);
  const r = score();
  const ranked = C.slice().sort((a, b) => r[b.id].s - r[a.id].s), win = ranked[0];
  document.getElementById("winner").textContent = r[win.id].s ? "1위 " + win.name : "숫자를 넣어 주세요";
  document.getElementById("bars").innerHTML = ranked.map((c, k) => `<div class="bar-row ${k === 0 ? "win" : ""}"><div class="top"><span>${k + 1}. ${TAK.esc(c.name)}</span><span>${r[c.id].s.toFixed(0)}점</span></div><div class="bar"><i style="width:${r[c.id].s}%"></i></div></div>`).join("");

  const active = IND.filter((i) => S.w[i.id] && C.filter((c) => num(i.id, c.id) != null).length >= 2);
  let keep = 0;
  active.forEach((i) => { const rr = score(i.id); if (C.slice().sort((a, b) => rr[b.id].s - rr[a.id].s)[0].id === win.id) keep++; });
  const all = IND.length * C.length;
  const filled = IND.reduce((a, i) => a + C.filter((c) => num(i.id, c.id) != null).length, 0);
  const sourced = IND.reduce((a, i) => a + C.filter((c) => num(i.id, c.id) != null && cell(i.id, c.id).src && cell(i.id, c.id).yr).length, 0);
  const gap = ranked.length > 1 ? r[ranked[0].id].s - r[ranked[1].id].s : 0;
  document.getElementById("meter").innerHTML = `<div><b>${keep}/${active.length}</b>기준 하나 빼도 1위</div><div><b>${gap.toFixed(0)}점</b>1·2위 차이</div><div><b>${sourced}/${all}</b>출처 있는 칸</div>`;

  const others = C.filter((c) => c.id !== win.id);
  const lines = active
    .map((i) => ({ i, d: S.w[i.id] * ((r[win.id].parts[i.id] || 0) - others.reduce((a, o) => a + (r[o.id].parts[i.id] || 0), 0) / others.length) }))
    .filter((x) => x.d > 0).sort((a, b) => b.d - a.d).slice(0, 3)
    .map(({ i }) => { const x = cell(i.id, win.id); return `${i.label}: ${win.name} ${fmtV(i, num(i.id, win.id))} (비교: ${others.map((o) => `${o.name} ${fmtV(i, num(i.id, o.id))}`).join(", ")}) · 출처 ${x.src || "없음"}${x.yr ? ", " + x.yr : ""}`; });
  reasonsText = lines.map((l, k) => k + 1 + ". " + l).join("\n");
  document.getElementById("reasons").innerHTML = lines.length ? lines.map((l) => `<li>${TAK.esc(l)}</li>`).join("") : "<li class='muted'>두 나라 이상 숫자를 넣으면 이유가 만들어져요.</li>";

  const ck = [];
  ck.push(filled < all ? ["warn", `빈 칸 ${all - filled}개. 모든 칸에 숫자를 넣어야 비교가 공정해요.`] : ["pass", "모든 칸을 채웠어요."]);
  ck.push(filled - sourced > 0 ? ["warn", `숫자는 있는데 출처나 연도가 없는 칸 ${filled - sourced}개`] : ["pass", "넣은 숫자 모두 출처·연도가 있어요."]);
  ck.push(active.length && keep === active.length ? ["pass", "기준 하나를 빼도 1위가 같아요. 결론이 튼튼해요."] : ["info", "기준 하나만 빼도 1위가 바뀌어요. 그 기준의 근거를 더 단단히 준비하세요."]);
  ck.push(["info", "'판단'으로 적은 칸(인증 난이도·경쟁)은 근거 문장을 함께 남기세요."]);
  TAK.checks(document.getElementById("checks"), ck);
}

document.getElementById("b-example").onclick = () => { applyExample(); buildTable(); update(); };
document.getElementById("b-clear").onclick = () => { if (!confirm("표의 숫자를 모두 비울까요?")) return; S.cells = {}; buildTable(); update(); };
document.getElementById("b-copy").onclick = () => {
  const rr = score();
  const rows = [["기준", "중요도", ...C.map((c) => c.name)].join("\t"), ...IND.map((i) => [i.label + " (" + i.unit + ")", S.w[i.id], ...C.map((c) => { const x = cell(i.id, c.id); return `${x.v === "" ? "입력" : x.v}${x.src ? " [" + x.src + (x.yr ? ", " + x.yr : "") + "]" : ""}`; })].join("\t")), ["종합 점수", "", ...C.map((c) => rr[c.id].s.toFixed(0))].join("\t")];
  TAK.copy(rows.join("\n"), "표를 복사했어요. 엑셀·슬라이드에 붙여 넣으세요");
};
document.getElementById("b-reasons").onclick = () => TAK.copy(reasonsText || "", "이유를 복사했어요");
document.getElementById("b-prompt").onclick = () => {
  TAK.promptModal("숫자 조사 질문", `너는 무역 통계 조사를 돕는 담당자다. 아래 표를 채울 "찾을 곳"과 "후보 숫자"를 알려 줘.
제품: ${P.product || "(제품)"} · HS ${P.hs || "(HS 6자리)"}
후보 나라: ${C.map((c) => c.name).join(", ")}
기준: 1) 연간 수입액(USD) 최근 3년 2) 연 증가율 3) 한국산 수입액과 비중 4) 우리가 받을 수 있는 관세(MFN·FTA) 5) 의료기기 인허가 제도와 난이도 6) 주요 경쟁 브랜드·수입국
규칙:
- 숫자마다 출처 이름, 표 이름, 기준연도를 붙여라. 모르면 "모름"이라고 써라.
- UN Comtrade, ITC Trade Map, K-stat, KOTRA 해외시장뉴스, 수입국 관세청 중 어디서 어떤 메뉴로 보는지 알려 줘.
- HS 6자리가 우리 제품보다 넓은 범위라는 한계와 좁히는 방법도 알려 줘.
- 한국 관세율표(한국으로 들여올 때 세율)와 수입국 세율을 섞지 마라.`, "나라 고르기");
};

buildTable();
update();
</script>
</body>
</html>
