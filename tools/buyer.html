<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바이어 찾기·상담</title>
<link rel="stylesheet" href="assets/app.css">
<style>
  .out { border: 1px solid var(--line); border-radius: 12px; padding: 22px; font-size: 15px; line-height: 1.7; }
  .out pre { white-space: pre-wrap; font-family: inherit; margin: 0; }
  .out h3 { font-size: 13px; color: var(--accent-ink); margin: 14px 0 6px; }
  .out h3:first-child { margin-top: 0; }
  .out select, .out input { font-size: 13.5px; padding: 6px 8px; }
  .flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
  @media (max-width: 720px) { .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .flow div { background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .flow b { display: block; color: var(--accent-ink); }
</style>
</head>
<body>
<main class="wrap">
  <div id="head"></div>

  <div class="flow">
    <div><b>① 매칭 신청</b>영문 제품 설명으로 비슷한 제품을 실제 수입한 바이어 찾기</div>
    <div><b>② 바이어 고르기</b>선적 횟수·물량·공급처로 점수 매기고 현지 확인</div>
    <div><b>③ 화상상담</b>질문 순서와 예상 반론 준비</div>
    <div><b>④ 상담일지·후속</b>요약 → 보완 → 다시 상담</div>
  </div>

  <div class="grid g-side">
    <section>
      <div class="tabs" id="otabs">
        <button data-o="match" class="on">① 매칭용 제품 설명</button>
        <button data-o="screen">② 바이어 고르기</button>
        <button data-o="call">③ 상담 대본</button>
        <button data-o="minute">④ 상담일지·후속 메일</button>
      </div>
      <div class="out" id="out"></div>
      <section class="card mt"><h2>점검</h2><ul class="checks mt" id="checks"></ul></section>
    </section>
    <aside class="card sticky">
      <div class="card-head"><div><h2>제품 정보</h2><p class="hint">05 홍보자료와 같은 정보예요.</p></div></div>
      <div id="form"></div>
      <a class="btn sm" href="promo.html">강점·인증 고치기 →</a>
    </aside>
  </div>
</main>

<script src="assets/app.js"></script>
<script src="assets/product.js"></script>
<script>
TAK.head("buyer.html",
  "KOTRA가 바이어를 찾고 상담을 이어 가는 방식(사례집 07·08)을 그대로 따라 합니다. 매칭 신청용 영문 제품 설명 → 바이어 고르기 → 상담 대본 → 상담일지까지 이어져요.",
  [["이 페이지에서", "바이어 매칭 신청부터 상담 후속까지 준비합니다."], ["준비물", "제품 용도·구성(영문), 받은 바이어 목록"], ["다 하면", "07 견적서·인보이스로 넘어가요."]],
  `<button class="btn primary" id="b-copy">복사</button>`);

let S = PROD.get(), tab = "match";
const certs = () => S.certs.split(",").map((s) => s.trim()).filter(Boolean);
const usps = () => S.usps.filter((u) => u.t);

// 사례집 08-1: 실거래(B/L) 매칭은 우리 제품 설명과 바이어 수입품 설명의 '뜻이 얼마나 비슷한지'로 바이어를 찾는다.
// 그래서 광고 문구가 아니라 "무엇을, 어디에, 누가 쓰는지"를 쓴다.
function matchText() {
  return `This product is the ${S.product}, used for ${S.use}. It consists of a ${S.build}. Main specifications: ${S.spec}. It is manufactured by ${S.company} in the Republic of Korea and exported under HS ${S.hs}.`;
}
function match() {
  const t = matchText(), wc = t.split(/\s+/).length;
  const req = [["사업자등록번호", "신청서에 직접 적어요", "info"], ["HS 코드 6자리", S.hs || "비어 있음", S.hs ? "ok" : "warn"], ["영문 수출제품 설명", wc + "단어", wc >= 40 && wc <= 120 ? "ok" : "warn"], ["진출 희망 국가", S.country || "비어 있음", S.country ? "ok" : "warn"]];
  return {
    html: `<h3>KOTRA 바이어 매칭 신청 필수 4가지</h3>
    <div class="tbl-wrap"><table><tbody>${req.map((r) => `<tr><td><b>${r[0]}</b></td><td>${TAK.esc(r[1])}</td><td><span class="tag ${r[2]}">${r[2] === "ok" ? "준비됨" : r[2] === "warn" ? "보완" : "직접"}</span></td></tr>`).join("")}</tbody></table></div>
    <h3>매칭용 영문 제품 설명</h3><pre>${TAK.esc(t)}</pre>
    <p class="small muted mt">AI가 이 문장과 실제 수입 바이어의 선하증권(B/L) 품목 설명을 비교해 비슷한 바이어 20곳을 추천해요. 2025년 129개사에 바이어 2,473곳을 연결해 6개국 15건 계약이 나왔어요 (사례집 08-1). 꾸밈말보다 용도·사용처·구성을 정확히 쓰세요.</p>`,
    text: t,
  };
}

// 사례집 08-2 AI 수출 부스터의 바이어 고르는 기준. 현지 확인 전에는 연락하지 않는다
const SV = [
  ["f", "1년 선적 횟수", ["1–2회", "분기 1회", "월 1회 이상"]],
  ["q", "한 번 물량 vs 우리 최소 주문", ["너무 큼", "조금 큼", "맞음"]],
  ["s", "공급처 수", ["1곳 (독점)", "2곳", "3곳 이상"]],
  ["d", "주 공급처 비중", ["늘어남", "그대로", "줄어듦 (바꿀 신호)"]],
  ["v", "현지 확인", ["안 함", "홈페이지·등록번호", "무역관·파트너 확인"]],
];
const total = (b) => SV.reduce((a, [k]) => a + (+b[k] || 1), 0);
function screen() {
  const rows = S.buyers.map((b, i) => {
    const tot = total(b), hold = (+b.v || 1) === 1;
    return `<tr data-b="${i}"><td><input data-bk="n" value="${TAK.esc(b.n)}" style="min-width:110px"></td>${SV.map(([k, , opt]) => `<td><select data-bk="${k}">${opt.map((o, j) => `<option value="${j + 1}" ${+b[k] === j + 1 ? "selected" : ""}>${j + 1} · ${o}</option>`).join("")}</select></td>`).join("")}<td class="num"><b>${tot}</b>/15</td><td>${hold ? '<span class="tag dark">연락 보류</span>' : tot >= 12 ? '<span class="tag ok">먼저 연락</span>' : '<span class="tag warn">검토</span>'}</td></tr>`;
  }).join("");
  return {
    html: `<p class="small muted" style="margin-bottom:10px">KOTRA 매칭이나 통관 데이터 서비스(Export Genius·Abrams 등)로 받은 바이어를 같은 기준으로 점수 매겨요. <b>현지 확인을 '안 함'이면 점수와 상관없이 연락하지 않아요.</b></p>
    <div class="tbl-wrap"><table><thead><tr><th>바이어</th>${SV.map((v) => `<th>${v[1]}</th>`).join("")}<th>합계</th><th>판단</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="btns mt"><button class="btn sm" id="b-addb">바이어 추가</button><button class="btn sm primary" id="b-sprompt">통관 데이터 분석 질문</button></div>
    <p class="small muted mt">기준 출처: KOTRA 'AI 수출 부스터'. 알제무역관은 바이어의 공급처 비중 변화를 포착해 끊긴 거래를 되살렸어요 (62만 달러, 사례집 08-2).</p>`,
    text: ["바이어,선적횟수,물량,공급처수,공급처비중,현지확인,합계"].concat(S.buyers.map((b) => [b.n, ...SV.map(([k]) => b[k]), total(b)].join(","))).join("\n"),
  };
}
function call() {
  const u = usps();
  const t = `1. 인사 (1분)
"Thank you for your time. I am with ${S.company}. May I ask how your team currently handles [the need this product solves]?"

2. 바이어 상황 듣기 (3분)
- How many clinics or sites would use it?
- What do you check first when buying: registration, price, or service?
- Who approves the purchase, and what documents do they need?

3. 제안 (3분)
${u.map((x, k) => `- Point ${k + 1}: ${x.t}${x.ev ? " (show: " + x.ev + ")" : ""}`).join("\n")}
- Terms: ${S.terms}

4. 예상 반론
- "Price is higher than other brands" → compare total cost incl. service and downtime; offer a sample order.
- "Is it registered here?" → explain the registration plan and the documents we provide (${certs().slice(0, 2).join(", ")}).
- "Who repairs it?" → ${S.support}.

5. 다음 단계 (1분)
"Could we send a quotation and arrange a demo within two weeks?"
→ 상담 후 24시간 안에 요약 메일 + 견적서 보내기`;
  return { html: `<pre>${TAK.esc(t)}</pre><p class="small muted mt">KOTRA 상담회는 AI 통번역 자막을 휴대폰으로 보여 줘요 (사례집 07). 통역이 없을 때는 이 대본을 짧은 문장으로 유지하세요.</p>`, text: t };
}
// 사례집 07: 상담 → 분석 → 보완 → 다시 상담
function minute() {
  const d = new Date(), ds = d.toISOString().slice(0, 10), due = new Date(d.getTime() + 7 * 864e5).toISOString().slice(0, 10);
  const log = `[상담일지] ${ds}
바이어: (회사 · 담당자 · 직함)   방식: 화상 / 전시 / 상담회
제품: ${S.product} → ${S.country}

1. 상담 요약 (3줄)
-
2. 바이어가 원한 것
- 인증·등록:
- 가격·조건 (지금 제안: ${S.terms}):
- 교육·A/S (지금 제안: ${S.support}):
3. 우리가 약속한 것 · 담당 · 기한
- 견적서 · (담당) · 24시간 안
- 보완 자료 (인증서 사본·카탈로그) · (담당) · ${due}
4. 다음 상담 준비
-
5. 지금 단계: 첫 만남 → 상담 → 샘플·견적 → 계약 중 (   )`;
  const mail = `Subject: Follow-up on our meeting – ${S.product}

Dear [Name],

Thank you for meeting us on ${ds}. Here is a short summary:
- Your main questions: [registration / price / service]
- What we will send: quotation (within 24 hours) and [documents] by ${due}

Next step: a follow-up call or product demo within two weeks.
Please let us know a convenient time.

Best regards,
${S.company}
${S.contact}`;
  return {
    html: `<h3>상담일지</h3><pre>${TAK.esc(log)}</pre><h3>후속 메일</h3><pre>${TAK.esc(mail)}</pre>
    <p class="small muted mt">KOTRA는 상담 음성을 바로 글로 바꿔 일지를 만들고, 상담 요약·진출 전략·다음 준비 사항을 담은 진단보고서를 기업에 줘요. 녹음을 AI로 요약할 때는 바이어 동의를 받으세요.</p>`,
    text: log + "\n\n---\n\n" + mail,
  };
}

let cur = { text: "" };
function render() {
  PROD.save(S);
  cur = { match, screen, call, minute }[tab]();
  document.getElementById("out").innerHTML = cur.html;
  const ck = [];
  if (tab === "match") {
    const m = matchText().match(/\b(innovative|premium|leading|advanced|high-end|best|unique|only|world-class|cutting-edge)\b/i);
    ck.push(m ? ["warn", `"${m[0]}"은 광고 문구예요. 매칭 정확도를 떨어뜨려요.`] : ["pass", "꾸밈말 없이 용도·구성 중심으로 썼어요."]);
    if (!S.use) ck.push(["warn", "'어디에 쓰나요'가 비어 있어요. 매칭에 가장 중요해요."]);
    if (!S.build) ck.push(["warn", "'무엇으로 구성되나요'가 비어 있어요."]);
  } else if (tab === "screen") {
    const hold = S.buyers.filter((b) => (+b.v || 1) === 1).length;
    ck.push(hold ? ["info", `현지 확인 안 한 바이어 ${hold}곳은 연락을 미뤄요. 무역관·현지 파트너에게 실재를 확인하세요.`] : ["pass", "모든 바이어를 현지 확인했어요."]);
    ck.push(["info", "첫 거래 전에 결제 계좌 변경 요청 같은 무역사기 신호가 없는지 확인하세요."]);
  } else ck.push(...PROD.risky(S, cur.text));
  TAK.checks(document.getElementById("checks"), ck);
}
PROD.form(document.getElementById("form"), S, render, ["product", "country", "hs", "use", "build", "spec", "terms", "support"]);

document.getElementById("otabs").onclick = (e) => { if (!e.target.dataset.o) return; tab = e.target.dataset.o; document.querySelectorAll("#otabs button").forEach((b) => b.classList.toggle("on", b === e.target)); render(); };
document.getElementById("out").addEventListener("change", (e) => {
  const tr = e.target.closest("[data-b]"); if (!tr || !e.target.dataset.bk) return;
  const k = e.target.dataset.bk; S.buyers[+tr.dataset.b][k] = k === "n" ? e.target.value : +e.target.value; render();
});
document.getElementById("out").addEventListener("click", (e) => {
  if (e.target.id === "b-addb") { S.buyers.push({ n: "Buyer " + String.fromCharCode(65 + S.buyers.length), f: 1, q: 1, s: 1, d: 2, v: 1 }); render(); }
  if (e.target.id === "b-sprompt") TAK.promptModal("통관 데이터 바이어 분석 질문", `너는 ${S.country} 의료기기 수입 바이어를 고르는 분석 담당자다.
우리 제품: ${S.product} (HS ${S.hs}) · ${S.use}
우리 조건: ${S.terms}

아래 통관(B/L) 데이터에서 바이어별로 표를 만들어 줘.
1) 최근 12개월 선적 횟수와 최근 선적일
2) 한 번 평균 물량(무게·금액)과 우리 최소 주문량과의 차이
3) 공급처 수와 상위 공급처 비중, 작년보다 비중이 늘었는지 줄었는지
4) 우리 제품과 품목 설명이 얼마나 비슷한지 (같음/비슷/다름 + 이유)
5) 공급처를 바꿀 가능성이 높은 바이어 3곳과 근거
규칙: 데이터에 없는 값은 "데이터 없음"으로 쓰고 추측하지 마라. 바이어가 실제로 있는 회사인지는 판단하지 마라 (무역관·현지 파트너로 따로 확인한다).

[통관 데이터 붙여 넣기]
`, "바이어·상담");
});
document.getElementById("b-copy").onclick = () => TAK.copy(cur.text, "복사했어요");

render();
</script>
</body>
</html>
