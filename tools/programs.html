<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지원사업 캘린더</title>
<link rel="stylesheet" href="assets/app.css">
<style>
  .status { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); background: var(--surface); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; }
  .status button { font: inherit; font-size: 13.5px; font-weight: 700; color: var(--accent-ink); background: none; border: 0; cursor: pointer; padding: 0; }
  .srcs { display: none; margin: -6px 0 16px; }
  .srcs.show { display: block; }
  .gl { font-size: 14px; font-weight: 700; color: var(--ink-2); margin: 12px 0 6px; }
  .gl:first-child { margin-top: 0; }
  .ncard { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 10px; }
  .ncard h3 { font-size: 16.5px; margin: 6px 0 4px; }
  .ncard h3 a { color: var(--ink); text-decoration: none; }
  .ncard h3 a:hover { color: var(--accent-ink); }
  .ncard .meta { font-size: 14px; color: var(--muted); }
  .ncard .why { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .ncard .ev { font-size: 14px; margin-top: 8px; background: var(--surface); border-radius: 8px; padding: 8px 10px; }
  .ncard .sum { font-size: 14px; color: var(--ink-2); margin-top: 8px; }
  .ncard .caution { font-size: 13.5px; color: var(--hot-ink); margin-top: 6px; }
  .ncard.closed { opacity: .6; }
  /* 달력 */
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
  .cal-head h3 { font-size: 20px; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .cal > div { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 96px; padding: 4px; font-size: 12px; }
  .cal .dow { min-height: 0; text-align: center; font-weight: 700; color: var(--muted); background: var(--surface); padding: 6px 0; }
  .cal .d { font-weight: 700; color: var(--ink-2); font-size: 13px; }
  .cal .out { background: #fafbfa; color: var(--muted); }
  .cal .today .d { background: var(--accent); color: #fff; border-radius: 6px; padding: 0 6px; display: inline-block; }
  .ev-lbl { display: block; margin-top: 3px; padding: 2px 5px; border-radius: 5px; font-size: 11.5px; font-weight: 600; line-height: 1.35; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; width: 100%; text-align: left; font-family: inherit; }
  .ev-end { background: var(--hot-soft); color: var(--hot-ink); }
  .ev-start { background: var(--accent-soft); color: var(--accent-ink); }
  .ev-event { background: var(--ok-soft); color: var(--ok); }
  .ev-posted { background: var(--surface); color: var(--ink-2); }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; margin-top: 10px; }
  .legend span { padding: 2px 8px; border-radius: 5px; }
  @media (max-width: 640px) { .cal > div { min-height: 64px; padding: 2px; } .ev-lbl { font-size: 10.5px; padding: 1px 3px; } }
  /* 타임라인 */
  .tl-month { font-size: 17px; font-weight: 800; margin: 18px 0 8px; }
  .tl-month:first-child { margin-top: 0; }
  .tl-item { display: grid; grid-template-columns: 74px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .tl-item .when { font-weight: 800; font-size: 15px; }
  .tl-item .when small { display: block; font-weight: 600; font-size: 12px; color: var(--muted); }
  .tl-item a { color: var(--ink); font-weight: 700; text-decoration: none; }
  .links { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .links a { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: 9px; background: var(--surface); text-decoration: none; font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .links a span { color: var(--muted); font-weight: 500; font-size: 13px; text-align: right; }
</style>
</head>
<body>
<main class="wrap">
  <div id="head"></div>

  <div class="status" id="status"></div>
  <div class="srcs card" id="srcs"></div>

  <div class="grid g-side">
    <section>
      <div class="tabs" id="tabs">
        <button data-v="rec" class="on">추천 공고</button>
        <button data-v="cal">달력</button>
        <button data-v="tl">타임라인</button>
        <button data-v="all">전체 공고</button>
      </div>
      <div id="view"></div>
    </section>

    <aside class="sticky">
      <section class="card" id="goal">
        <h2>우리 목표</h2>
        <p class="hint mb">고르면 바로 추천이 바뀝니다.</p>
        <div class="gl">무엇을 하고 싶나요? (여러 개)</div>
        <div class="chips" id="g-goals"></div>
        <div class="gl">어느 지역에 팔고 싶나요?</div>
        <div class="chips" id="g-areas"></div>
        <div class="row mt">
          <div class="field"><label>본사 지역</label><select id="g-region"></select></div>
          <div class="field"><label>언제까지</label><select id="g-months"><option value="1">1개월 안</option><option value="3">3개월 안</option><option value="6">6개월 안</option><option value="12">1년 안</option></select></div>
        </div>
        <div class="field"><label>수출 경험</label><select id="g-exp"><option value="none">처음이에요</option><option value="some">조금 있어요</option></select></div>
        <button class="btn sm" id="g-reset">회사 정보로 다시 채우기</button>
      </section>
      <section class="card mt">
        <h2>공고 원문 바로가기</h2>
        <p class="hint mb">여기서 직접 찾아볼 수도 있어요.</p>
        <ul class="links" id="links"></ul>
      </section>
    </aside>
  </div>
</main>
<script src="assets/app.js"></script>
<script src="data/notices.js"></script>
<script src="assets/notices-lib.js"></script>
<script>
TAK.head("programs.html",
  "한국의료기기협동조합·보건복지부·산업통상부·중소벤처기업부·KOTRA의 수출 지원 공고(해외 전시회, 지사화 포함)를 매일 모아 달력에 놓습니다. 목표를 고르면 맞는 공고를 이유와 함께 추천합니다.",
  [["이 페이지에서", "접수 중인 공고와 마감일을 한눈에 봅니다."], ["준비물", "하고 싶은 일(전시회·바이어·인증 등)과 관심 지역"], ["다 하면", "마음에 드는 공고를 내 캘린더에 넣고 원문으로 신청하세요."]]);

const { data, SRC, GOALS, AREAS } = NLIB;
const P = TAK.profile();
let G = TAK.load("goal", null) || NLIB.defaultGoal(P);
let view = "rec", calM = NLIB.today.slice(0, 7);

/* ---------- 수집 상태 ---------- */
const okN = data.sources.filter((s) => s.ok).length;
const upd = data.updated ? new Date(data.updated).toLocaleString("ko-KR", { dateStyle: "medium", timeStyle: "short" }) : "–";
document.getElementById("status").innerHTML = `<span>📅 마지막 수집 <b>${upd}</b></span><span>공고 <b>${data.items.length}</b>건</span><span>출처 ${okN}/${data.sources.length}곳 정상</span><button id="b-src">출처별 상태 보기</button>`;
document.getElementById("srcs").innerHTML = `<ul class="checks">${data.sources.map((s) => `<li class="${s.ok ? "pass" : "info"}"><span class="ic">${s.ok ? "✓" : "i"}</span><span><b>${TAK.esc(s.name)}</b> · ${s.count}건${s.note ? " · " + TAK.esc(s.note) : ""}</span></li>`).join("")}</ul>
  <p class="small muted mt">매일 오전 6시에 GitHub Actions가 수집합니다. 공식 API를 우선 쓰고, 게시판은 robots.txt가 허용하는 곳만 읽습니다. 중소벤처기업부·산업통상부·보건복지부·KOTRA 공고는 정부 통합 공고 창구인 기업마당 API로, 의료기기협동조합 공지는 보건산업진흥원 게시판으로 받습니다.</p>`;
document.getElementById("b-src").onclick = () => document.getElementById("srcs").classList.toggle("show");

document.getElementById("links").innerHTML = [
  ["한국의료기기협동조합", "https://www.kmdica.or.kr/", "교육·해외인증·전시"],
  ["보건산업진흥원 교육·행사 게시판", "https://www.khidi.or.kr/board?menuId=MENU01491", "복지부 산하·협동조합 글"],
  ["기업마당 지원사업 공고", "https://www.bizinfo.go.kr/", "중기부·산업부 등 통합"],
  ["KOTRA 무역투자24", "https://www.kotra.or.kr/", "지사화·해외전시 신청"],
  ["글로벌전시플랫폼 (GEP)", "https://www.gep.or.kr/", "해외전시 한국관 모집"],
  ["수출바우처", "https://www.exportvoucher.com/", "마케팅·인증 비용 지원"],
].map(([n, u, d]) => `<li><a href="${u}" target="_blank" rel="noopener">${n}<span>${d}</span></a></li>`).join("");

/* ---------- 목표 ---------- */
document.getElementById("g-region").innerHTML = TAK.REGIONS.map((r) => `<option>${r}</option>`).join("");
function fillGoal() {
  document.getElementById("g-goals").innerHTML = GOALS.map(([k, l]) => `<button class="chip ${G.goals.includes(k) ? "on" : ""}" data-g="${k}">${l}</button>`).join("");
  document.getElementById("g-areas").innerHTML = AREAS.map((a) => `<button class="chip ${G.areas.includes(a) ? "on" : ""}" data-a="${a}">${a}</button>`).join("");
  document.getElementById("g-region").value = G.region;
  document.getElementById("g-months").value = String(G.months);
  document.getElementById("g-exp").value = G.exp;
}
document.getElementById("goal").addEventListener("click", (e) => {
  const t = e.target;
  if (t.dataset.g) G.goals = G.goals.includes(t.dataset.g) ? G.goals.filter((x) => x !== t.dataset.g) : [...G.goals, t.dataset.g];
  else if (t.dataset.a) G.areas = G.areas.includes(t.dataset.a) ? G.areas.filter((x) => x !== t.dataset.a) : [...G.areas, t.dataset.a];
  else if (t.id === "g-reset") G = NLIB.defaultGoal(P);
  else return;
  fillGoal(); render();
});
document.getElementById("goal").addEventListener("change", (e) => {
  if (e.target.id === "g-region") G.region = e.target.value;
  if (e.target.id === "g-months") G.months = +e.target.value;
  if (e.target.id === "g-exp") G.exp = e.target.value;
  render();
});

/* ---------- 공고 카드 ---------- */
const srcName = (n) => (SRC[n.src] || SRC.etc).name;
const fmt = (d) => (d ? d.slice(2).replace(/-/g, ".") : "");
function card(n, why) {
  const st = NLIB.status(n);
  return `<article class="ncard ${st.k === "closed" ? "closed" : ""}">
    <span class="tag ${st.cls}">${st.label}</span> ${(n.types || []).map((t) => `<span class="tag line">${t}</span>`).join(" ")} ${n.regions && n.regions.length ? `<span class="tag warn">${n.regions.join("·")} 기업만</span>` : ""}
    <h3><a href="${n.url}" target="_blank" rel="noopener">${TAK.esc(n.title)}</a></h3>
    <div class="meta">${TAK.esc(n.org)} · 출처 ${srcName(n)}${n.via ? " (" + n.via + ")" : ""}${n.start || n.end ? ` · 접수 ${fmt(n.start) || "?"} ~ ${fmt(n.end) || "?"}` : n.posted ? ` · 게시 ${fmt(n.posted)}` : ""}</div>
    ${n.event ? `<div class="ev">🗓 <b>${TAK.esc(n.event.name)}</b> · ${fmt(n.event.start)}–${fmt(n.event.end)} · ${TAK.esc(n.event.place || "")}</div>` : ""}
    ${n.summary ? `<div class="sum">${TAK.esc(n.summary)}</div>` : ""}
    ${n.caution ? `<div class="caution">⚠ ${TAK.esc(n.caution)}</div>` : ""}
    ${why && why.length ? `<div class="why">${why.map((w) => `<span class="tag ok">✓ ${TAK.esc(w)}</span>`).join("")}</div>` : ""}
    <div class="btns mt"><a class="btn sm primary" href="${n.url}" target="_blank" rel="noopener">공고 원문 보기</a>${n.end || (n.event && n.event.start) ? `<button class="btn sm" data-ics="${n.id}">내 캘린더에 추가</button>` : ""}<button class="btn sm" data-ai="${n.id}">AI로 신청 준비</button></div>
  </article>`;
}

function viewRec() {
  const r = NLIB.recommend(G);
  const closedMatch = data.items.filter((n) => NLIB.status(n).k === "closed" && (n.types || []).some((t) => G.goals.includes(t)) && n.med).slice(0, 3);
  return (r.length
    ? `<p class="hint mb">목표·지역·마감일을 기준으로 <b>${r.length}건</b>을 골랐어요. 위에 있을수록 더 잘 맞아요.</p>` + r.map(({ n, why }) => card(n, why)).join("")
    : `<div class="banner info"><span>i</span><div>지금 조건에 맞는 공고가 없어요. 목표나 지역을 더 고르거나 기간을 늘려 보세요.</div></div>`) +
    (closedMatch.length ? `<h3 class="mt mb" style="font-size:16px">지난 공고 (내년 일정 참고)</h3>` + closedMatch.map((n) => card(n)).join("") : "");
}

function viewCal() {
  const [y, m] = calM.split("-").map(Number);
  const first = new Date(y, m - 1, 1), start = new Date(y, m - 1, 1 - first.getDay());
  const recIds = new Set(NLIB.recommend(G).map((x) => x.n.id));
  const onlyRec = TAK.load("calRec", false);
  const evs = {};
  data.items.filter((n) => !onlyRec || recIds.has(n.id)).forEach((n) => NLIB.events(n).forEach((e) => (evs[e.d] = evs[e.d] || []).push({ n, e })));
  let h = ["일", "월", "화", "수", "목", "금", "토"].map((d) => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const ds = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    h += `<div class="${d.getMonth() !== m - 1 ? "out" : ""} ${ds === NLIB.today ? "today" : ""}"><span class="d">${d.getDate()}</span>${(evs[ds] || []).map(({ n, e }) => `<button class="ev-lbl ev-${e.k}" data-open="${n.id}" title="${TAK.esc(e.label + " · " + n.title)}">${e.label === "접수 마감" ? "마감 " : e.label === "접수 시작" ? "시작 " : ""}${TAK.esc(e.k === "event" ? e.label : n.title)}</button>`).join("")}</div>`;
  }
  return `<div class="cal-head"><button class="btn sm" data-mv="-1">← 이전 달</button><h3>${y}년 ${m}월</h3><button class="btn sm" data-mv="1">다음 달 →</button></div>
  <label style="display:flex;gap:8px;align-items:center;font-weight:600;margin-bottom:10px"><input type="checkbox" id="cal-rec" ${onlyRec ? "checked" : ""}> 추천 공고만 보기</label>
  <div class="cal">${h}</div>
  <div class="legend"><span class="ev-start">접수 시작</span><span class="ev-end">접수 마감</span><span class="ev-event">전시회·행사</span><span class="ev-posted">게시일 (기간 원문 확인)</span></div>`;
}

function keyDate(n) { const st = NLIB.status(n); return st.k === "soon" ? n.start : n.end || (n.event && n.event.start) || n.posted || ""; }
function viewTl() {
  const list = data.items.filter((n) => NLIB.status(n).k !== "closed").sort((a, b) => keyDate(a).localeCompare(keyDate(b)));
  let cur = "", h = "";
  list.forEach((n) => {
    const d = keyDate(n), mon = d.slice(0, 7);
    if (mon !== cur) { cur = mon; h += `<div class="tl-month">${mon.replace("-", "년 ")}월</div>`; }
    const st = NLIB.status(n);
    h += `<div class="tl-item"><div class="when">${d.slice(5).replace("-", ".")}<small>${st.k === "soon" ? "접수 시작" : n.end ? "접수 마감" : "게시"}</small></div><div><a href="${n.url}" target="_blank" rel="noopener">${TAK.esc(n.title)}</a><div class="small muted">${TAK.esc(n.org)} · <span class="tag ${st.cls}">${st.label}</span>${n.event ? ` · 전시 ${fmt(n.event.start)}` : ""}</div></div></div>`;
  });
  return h || `<p class="hint">진행 중이거나 예정된 공고가 없어요.</p>`;
}

function viewAll() {
  const f = TAK.load("allSrc", "");
  const list = data.items.filter((n) => !f || n.src === f);
  return `<div class="chips mb">${[["", "전체"], ...Object.entries(SRC).map(([k, v]) => [k, v.name])].map(([k, l]) => `<button class="chip ${f === k ? "on" : ""}" data-src="${k}">${l} ${k ? data.items.filter((n) => n.src === k).length : data.items.length}</button>`).join("")}</div>` +
    list.map((n) => card(n)).join("");
}

function render() {
  TAK.save("goal", G);
  document.getElementById("view").innerHTML = { rec: viewRec, cal: viewCal, tl: viewTl, all: viewAll }[view]();
  const n = NLIB.recommend(G).length;
  document.querySelector('#tabs [data-v="rec"]').textContent = `추천 공고 ${n}`;
}

function aiPrompt(n) {
  return `너는 중소 의료기기 기업의 수출 지원사업 신청을 돕는 담당자다.
우리 회사: ${P.company || "(입력)"} · 제품: ${P.product || "(입력)"} (HS ${P.hs || "?"}, ${P.grade ? P.grade + "등급" : "등급 미정"}) · 본사 ${P.region || "?"} · 수출 경험 ${P.exp === "some" ? "있음" : "없음"}
공고: ${n.title}
주관: ${n.org} / 접수 ${n.start || "?"} ~ ${n.end || "?"}${n.event ? ` / 행사 ${n.event.name} ${n.event.start}~${n.event.end} ${n.event.place || ""}` : ""}
원문: ${n.url}

해 줄 일:
1. 원문 공고를 기준으로 신청 자격, 제출 서류, 우리 회사 부담 비용을 표로 정리
2. 마감까지 날짜별 할 일 체크리스트 (서류 준비 → 온라인 신청 → 이메일 제출 → 신청금 납부처럼 단계가 여럿이면 모두)
3. 평가 기준(수출실적·기업경쟁력·전시적합성 등)에 맞춰 신청서에 쓸 우리 회사 강점 초안 3줄
규칙: 원문에 없는 내용은 "원문 확인 필요"라고 쓰고 추측하지 마라. 날짜·금액은 원문 그대로 옮겨라.`;
}

document.getElementById("tabs").onclick = (e) => { if (!e.target.dataset.v) return; view = e.target.dataset.v; document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b === e.target)); render(); };
document.getElementById("view").addEventListener("click", (e) => {
  const t = e.target;
  const find = (id) => data.items.find((x) => x.id === id);
  if (t.dataset.mv) { const [y, m] = calM.split("-").map(Number); const d = new Date(y, m - 1 + +t.dataset.mv, 1); calM = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; render(); }
  else if (t.dataset.open) { const n = find(t.dataset.open); const mm = TAK.modal(card(n) + `<div class="btns"><button class="btn" id="m-close">닫기</button></div>`); mm.querySelector("#m-close").onclick = TAK.closeModal; }
  else if (t.dataset.src != null) { TAK.save("allSrc", t.dataset.src); render(); }
});
document.getElementById("view").addEventListener("change", (e) => { if (e.target.id === "cal-rec") { TAK.save("calRec", e.target.checked); render(); } });
document.addEventListener("click", (e) => {
  const t = e.target;
  const find = (id) => data.items.find((x) => x.id === id);
  if (t.dataset.ics) {
    const n = find(t.dataset.ics);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([NLIB.ics(n)], { type: "text/calendar" }));
    a.download = "공고_" + n.id + ".ics"; a.click();
    TAK.toast("캘린더 파일을 받았어요. 열면 내 캘린더에 들어가요");
  } else if (t.dataset.ai) {
    TAK.closeModal();
    TAK.promptModal("공고 신청 준비 질문", aiPrompt(find(t.dataset.ai)), "회사·제품");
  }
});

fillGoal();
render();
</script>
</body>
